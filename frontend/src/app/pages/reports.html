<section class="page"><div class="eyebrow">Отчётность</div><h1 class="page-title">Экспорт кандидатов</h1><p class="lead">Скачайте CSV с записями каталога и доступными измерениями. Выбор активности ограничивает выгрузку подходящим тестом.</p><div class="card shadow-sm" style="max-width:600px"><label class="field">Тип активности<select [formControl]="form.controls.activityCode"><option value="">Все активности</option>@for(a of assays();track a.id){<option [value]="a.activityCode">{{a.name}} ({{a.activityCode}})</option>}</select></label><button class="btn" style="margin-top:16px" (click)="download()">Скачать CSV</button>@if(error()){<p class="error">{{error()}}</p>}</div><p class="muted" style="margin-top:16px">Выгрузка содержит источник измерений; экспериментальные результаты не интерпретируются как медицинская рекомендация.</p></section>
