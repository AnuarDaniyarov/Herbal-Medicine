spring:
  application:
    name: medicine-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medicine_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1006}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

assistant:
  llm:
    enabled: ${ASSISTANT_LLM_ENABLED:false}
    base-url: ${ASSISTANT_LLM_BASE_URL:}
    model: ${ASSISTANT_LLM_MODEL:local-model}
    api-key: ${ASSISTANT_LLM_API_KEY:}

app:
  security:
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  prediction:
    model-path: ${APP_MODEL_PATH:./data/processed/ache-baseline-model.json}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
