services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicine_platform
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/medicine_platform
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ASSISTANT_LLM_ENABLED: ${ASSISTANT_LLM_ENABLED:-false}
      ASSISTANT_LLM_BASE_URL: ${ASSISTANT_LLM_BASE_URL:-}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-local-model}
      ASSISTANT_LLM_API_KEY: ${ASSISTANT_LLM_API_KEY:-}
      SEARCH_EMBEDDING_URL: ${SEARCH_EMBEDDING_URL:-}
      SEARCH_EMBEDDING_MODEL_ID: ${SEARCH_EMBEDDING_MODEL_ID:-intfloat/multilingual-e5-small}
      SERVER_PORT: 8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    volumes:
      - ./data/processed:/app/data/processed:ro
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/actuator/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    profiles: ["semantic-search"]
    command: ["--model-id", "intfloat/multilingual-e5-small"]
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - embedding_model_cache:/data

volumes:
  postgres_data:
  embedding_model_cache:
